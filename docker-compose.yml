services:
  veteran_web_app:
    build:
      context: .
    ports:
      - "8000:8000" # Adjust the port as needed
    environment:
      - DB_URL=postgresql://postgres:password@service_db:5432/veteran_app_db
      - OPENAI_API_KEY=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
    depends_on:
      - service_db

  service_db:
    image: postgres:latest
